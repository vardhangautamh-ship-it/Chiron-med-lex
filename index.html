<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiron — Medical Jurisprudence Intelligence</title>
<meta name="description" content="Chiron — Medical Jurisprudence Intelligence System for Indian Law. Powered by Grok 4.">
<style>
:root {
  --bg-base:    #050d1a;
  --bg-panel:   #0a1628;
  --bg-card:    #0f1f38;
  --bg-input:   #060e1c;
  --bg-strip:   #0d1a2e;
  --bg-hover:   #1a2d4a;
  --gold:       #c9a84c;
  --gold-dark:  #a07830;
  --gold-hi:    #e8c87a;
  --gold-faint: rgba(201,168,76,0.08);
  --gold-line:  rgba(201,168,76,0.22);
  --fg:         #f0ede8;
  --fg-2:       #d8d4cc;
  --fg-3:       #9aa6b8;
  --fg-faint:   #5a6a83;
  --slate:      #2a3f5f;
  --slate-2:    #1d2e48;
  --steel-blue: #5b86b8;
  --steel-blue-d:#2a5f8f;
  --amber:      #e0a040;
  --amber-d:    #8a5a20;
  --purple:     #8a72b8;
  --purple-d:   #3a2e54;
  --radius-sm:  3px;
  --radius:     5px;
  --radius-lg:  8px;
  --f-display:  "Playfair Display", Georgia, serif;
  --f-serif:    "Source Serif 4", Georgia, serif;
  --f-mono:     "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow: hidden; }
body {
  background: var(--bg-base);
  color: var(--fg);
  font-family: var(--f-serif);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }

/* App shell */
.app {
  display: grid;
  grid-template-columns: 264px 1fr;
  grid-template-rows: 56px 1fr;
  height: 100vh;
  background: var(--bg-base);
  overflow: hidden;
}
.app__hdr  { grid-column: 1 / -1; }
.app__side { grid-column: 1; grid-row: 2; }
.app__main { grid-column: 2; grid-row: 2; min-width: 0; }

/* Header */
.hdr {
  display: flex; align-items: center; gap: 14px;
  height: 56px; padding: 0 18px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--slate-2);
  position: relative;
}
.hdr::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg,transparent 0%,var(--gold-line) 30%,var(--gold-line) 70%,transparent 100%);
  opacity: .35;
}
.hdr__seal { width: 32px; height: 32px; flex: none; }
.hdr__title { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hdr__brand { font-family: var(--f-display); font-size: 24px; font-weight: 600; letter-spacing: 0.005em; color: var(--gold); line-height: 1.05; }
.hdr__sub   { font-family: var(--f-mono); font-size: 9px; font-weight: 400; letter-spacing: 0.18em; color: var(--fg-faint); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr__meta  { display: flex; align-items: center; gap: 18px; font-family: var(--f-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.06em; }
.hdr__meta span b { color: var(--fg-2); font-weight: 500; }

.status-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 9px;
  border: 1px solid var(--gold-line); border-radius: 999px;
  background: var(--bg-base);
  font-family: var(--f-mono); font-size: 10px; font-weight: 500;
  color: var(--gold); letter-spacing: 0.16em;
}
.status-badge__dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 0 rgba(201,168,76,0.55);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.55); }
  50%      { box-shadow: 0 0 0 6px rgba(201,168,76,0); }
}

/* Sidebar */
.side {
  background: var(--bg-panel);
  border-right: 1px solid var(--slate-2);
  display: flex; flex-direction: column;
  min-height: 0;
}
.side__inner {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 18px 12px 12px;
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
}
.side__inner::-webkit-scrollbar { width: 6px; }
.side__inner::-webkit-scrollbar-thumb { background: var(--slate-2); border-radius: 3px; }
.side__lbl {
  font-family: var(--f-mono); font-size: 9px; font-weight: 500;
  letter-spacing: 0.22em; color: var(--fg-faint); text-transform: uppercase;
  padding: 0 10px 6px; border-bottom: 1px solid var(--slate-2); margin-bottom: 4px;
}
.mod {
  display: grid; grid-template-columns: 18px minmax(0,1fr) auto;
  align-items: center; gap: 10px;
  width: 100%; min-width: 0;
  padding: 9px 10px 9px 12px;
  background: transparent; border: 0;
  border-left: 2px solid transparent;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--fg-2); text-align: left;
  font-family: var(--f-serif); font-size: 14px; font-weight: 500;
  transition: background .12s, border-color .12s, color .12s;
}
.mod__ic  { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; color: var(--fg-3); }
.mod__kbd { font-family: var(--f-mono); font-size: 9px; color: var(--fg-faint); letter-spacing: 0.08em; }
.mod:hover { background: var(--bg-hover); border-left-color: var(--gold); color: var(--fg); }
.mod:hover .mod__ic { color: var(--gold); }
.mod.is-active { background: var(--bg-card); border-left: 2px solid var(--gold); color: var(--gold); }
.mod.is-active .mod__ic { color: var(--gold); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
.tag {
  padding: 4px 8px; background: var(--bg-base); border: 1px solid var(--slate);
  color: var(--gold-dark); font-family: var(--f-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em; border-radius: var(--radius-sm); cursor: default;
  transition: color .15s, border-color .15s;
}
.tag:hover { color: var(--gold); border-color: var(--gold-line); }
.side__foot {
  padding: 14px 16px; border-top: 1px solid var(--slate-2); background: var(--bg-base);
  display: flex; flex-direction: column; gap: 4px;
}
.side__foot__pwr { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--gold); letter-spacing: 0.12em; }
.side__foot__ver { font-family: var(--f-mono); font-size: 9px; color: var(--fg-faint); letter-spacing: 0.16em; }

/* Main */
.main { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.main::-webkit-scrollbar { width: 8px; }
.main::-webkit-scrollbar-thumb { background: var(--slate-2); border-radius: 4px; }

/* Tabs */
.tabs {
  display: flex; align-items: stretch;
  background: var(--bg-panel); border-bottom: 1px solid var(--slate-2);
  padding: 0 22px; gap: 4px; flex-shrink: 0;
}
.tab {
  position: relative; padding: 14px 18px 13px;
  background: transparent; border: 0;
  color: var(--fg-3); font-family: var(--f-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.tab:hover { color: var(--fg-2); }
.tab.is-active { color: var(--gold); }
.tab.is-active::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--gold); }
.tab__count {
  margin-left: 8px; padding: 1px 6px;
  border: 1px solid var(--slate); border-radius: 2px;
  font-size: 9px; color: var(--fg-faint);
}
.tab.is-active .tab__count { color: var(--gold); border-color: var(--gold-line); }

/* Composer */
.comp { padding: 26px 28px 0; display: flex; flex-direction: column; gap: 18px; }
.comp__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.comp__h    { font-family: var(--f-display); font-size: 26px; font-weight: 600; color: var(--fg); letter-spacing: 0.005em; line-height: 1.25; margin: 0; }
.comp__sub  { font-family: var(--f-mono); font-size: 10px; color: var(--fg-faint); letter-spacing: 0.18em; text-transform: uppercase; }
.comp__case { display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; }
.comp__case b { color: var(--gold); font-weight: 500; }
.textarea-wrap {
  position: relative; background: var(--bg-input);
  border: 1px solid var(--slate); border-radius: var(--radius);
  transition: border-color .15s, box-shadow .15s;
}
.textarea-wrap:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.08); }
.textarea {
  width: 100%; min-height: 180px; padding: 18px 20px 44px;
  background: transparent; border: 0; outline: 0;
  color: var(--fg); font-family: var(--f-serif); font-size: 15.5px;
  line-height: 1.6; resize: vertical;
}
.textarea::placeholder { color: var(--fg-faint); font-style: italic; }
.textarea-wrap__foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-top: 1px solid var(--slate-2);
  font-family: var(--f-mono); font-size: 10px; color: var(--fg-faint); letter-spacing: 0.1em;
}
.textarea-wrap__foot button {
  background: transparent; border: 0; color: var(--fg-3);
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.12em; padding: 4px 8px;
}
.textarea-wrap__foot button:hover { color: var(--gold); }
.examples {
  background: var(--bg-strip); border: 1px solid var(--slate-2); border-radius: var(--radius);
  padding: 10px 12px; display: flex; align-items: center; gap: 12px; margin-top: -2px;
}
.examples__lbl {
  font-family: var(--f-mono); font-size: 9px; color: var(--fg-faint);
  letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap;
  padding-right: 6px; border-right: 1px solid var(--slate-2);
}
.examples__row {
  display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; padding: 2px;
  scrollbar-width: thin; scrollbar-color: var(--slate) transparent;
}
.examples__row::-webkit-scrollbar { height: 4px; }
.examples__row::-webkit-scrollbar-thumb { background: var(--slate); border-radius: 2px; }
.ex {
  flex: none; padding: 6px 12px; background: transparent;
  border: 1px solid var(--slate); border-radius: var(--radius-sm);
  color: var(--fg-3); font-family: var(--f-serif); font-size: 13px;
  white-space: nowrap; scroll-snap-align: start;
  transition: color .15s, border-color .15s;
}
.ex:hover { color: var(--gold); border-color: var(--gold-line); }
.ex__id { font-family: var(--f-mono); font-size: 10px; color: var(--fg-faint); letter-spacing: 0.1em; margin-right: 6px; }
.ex:hover .ex__id { color: var(--gold-dark); }
.comp__bar {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 24px;
}
.comp__settings { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: var(--radius);
  font-family: var(--f-display); font-size: 14px; font-weight: 600;
  letter-spacing: 0.01em; border: 1px solid transparent;
  transition: background .15s, color .15s, box-shadow .15s, border-color .15s;
  white-space: nowrap;
}
.btn--primary { background: var(--gold); color: var(--bg-base); border-color: var(--gold); }
.btn--primary:hover { background: var(--gold-hi); border-color: var(--gold-hi); box-shadow: 0 2px 12px rgba(201,168,76,0.18); }
.btn--secondary { background: var(--bg-panel); color: var(--gold); border-color: var(--gold-line); }
.btn--secondary:hover { border-color: var(--gold); color: var(--gold-hi); box-shadow: 0 2px 12px rgba(201,168,76,0.12); }
.btn--ghost {
  background: transparent; color: var(--fg-3); border-color: var(--slate);
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; font-weight: 500;
}
.btn--ghost:hover { color: var(--gold); border-color: var(--gold-line); }
.btn--hindi { background: var(--bg-panel); color: var(--steel-blue); border-color: var(--steel-blue-d); font-family: var(--f-serif); font-size: 14px; }
.btn--hindi:hover { color: #a8c4e6; border-color: var(--steel-blue); box-shadow: 0 2px 12px rgba(91,134,184,0.15); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; background: var(--bg-panel);
  border: 1px solid var(--slate); border-radius: var(--radius);
  font-family: var(--f-mono); font-size: 10px; color: var(--fg-3);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.toggle.is-on { color: var(--gold); border-color: var(--gold-line); }
.toggle__sw { width: 22px; height: 12px; border-radius: 999px; background: var(--slate); position: relative; transition: background .15s; }
.toggle__sw::after { content: ""; position: absolute; left: 1px; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg-3); transition: transform .15s, background .15s; }
.toggle.is-on .toggle__sw { background: var(--gold-dark); }
.toggle.is-on .toggle__sw::after { transform: translateX(10px); background: var(--gold-hi); }

/* Error banner */
.error-banner {
  margin: 18px 28px 0;
  padding: 14px 18px;
  background: rgba(160,30,30,0.15);
  border: 1px solid rgba(200,50,50,0.35);
  border-radius: var(--radius);
  color: #e88;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
}
.error-banner b { display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; }

/* Report */
.report {
  padding: 0 28px 60px;
  display: flex; flex-direction: column; gap: 22px;
  border-top: 1px solid var(--slate-2); margin-top: 8px; padding-top: 26px;
  background: radial-gradient(900px 200px at 60% 0%,rgba(201,168,76,0.04),transparent 60%), transparent;
}
.report__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.report__head h1 { margin: 0; font-family: var(--f-display); font-size: 30px; font-weight: 600; color: var(--fg); letter-spacing: 0.002em; line-height: 1.3; }
.report__id { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.12em; }
.report__id b { color: var(--gold); font-weight: 500; }

/* Confidence */
.confidence {
  display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center;
  padding: 22px 26px; background: var(--bg-card);
  border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
}
.confidence__score { display: flex; flex-direction: column; gap: 2px; }
.confidence__score__num { font-family: var(--f-display); font-size: 56px; font-weight: 700; color: var(--gold); line-height: 1; letter-spacing: -0.01em; }
.confidence__score__lbl { font-family: var(--f-mono); font-size: 9px; color: var(--fg-faint); letter-spacing: 0.22em; text-transform: uppercase; }
.confidence__bar { display: flex; flex-direction: column; gap: 8px; }
.confidence__bar__top { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.14em; text-transform: uppercase; }
.confidence__bar__top b { color: var(--gold); font-weight: 500; }
.confidence__bar__track { height: 6px; border-radius: 3px; background: rgba(42,63,95,0.5); overflow: hidden; position: relative; }
.confidence__bar__fill { position: absolute; left:0; top:0; bottom:0; background: linear-gradient(90deg,var(--gold-dark) 0%,var(--gold) 75%,var(--gold-hi) 100%); border-radius: 3px; transition: width 1s ease; }
.confidence__bar__flag { font-family: var(--f-mono); font-size: 10.5px; color: var(--amber); letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; }
.confidence__bar__flag::before { content: "▲"; font-size: 9px; }
.confidence__stat { display: flex; flex-direction: column; gap: 6px; min-width: 130px; border-left: 1px solid var(--slate-2); padding-left: 22px; }
.confidence__stat__row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.06em; }
.confidence__stat__row b { color: var(--gold); font-weight: 500; }

/* Section */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec__hd { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--slate-2); }
.sec__num   { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--gold); letter-spacing: 0.16em; }
.sec__title { font-family: var(--f-display); font-size: 22px; font-weight: 600; color: var(--fg); letter-spacing: 0.003em; line-height: 1.3; }
.sec__conf  { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-3); padding: 3px 8px; border: 1px solid var(--slate); border-radius: 2px; }
.sec__conf b { color: var(--gold); font-weight: 500; }

.finding {
  background: var(--bg-panel); border-left: 2px solid var(--gold);
  padding: 14px 18px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  display: flex; flex-direction: column; gap: 6px;
}
.finding__body { font-family: var(--f-serif); font-size: 15px; color: var(--fg-2); line-height: 1.65; white-space: pre-wrap; text-wrap: pretty; }
.finding__body em { color: var(--gold-hi); font-style: italic; }

.disclaimer {
  margin-top: 6px; padding: 14px 18px; background: #0a0b1a;
  border: 1px solid var(--purple-d); border-radius: var(--radius);
  color: var(--purple); font-family: var(--f-serif); font-size: 13.5px; line-height: 1.6; font-style: italic;
}
.disclaimer b { font-family: var(--f-mono); font-style: normal; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10.5px; display: block; margin-bottom: 4px; color: #a78ed8; }

/* Certificate */
.cert {
  position: relative; background: var(--bg-card);
  border-top: 2px solid var(--gold);
  border-radius: 2px var(--radius) var(--radius) var(--radius);
  padding: 22px 26px 24px; overflow: hidden;
}
.cert::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(135deg,rgba(201,168,76,0.025) 0px,rgba(201,168,76,0.025) 1px,transparent 1px,transparent 18px), radial-gradient(circle at 90% 10%,rgba(201,168,76,0.07),transparent 35%);
  pointer-events: none;
}
.cert::after {
  content: "CHIRON"; position: absolute; right: -8px; top: 38%;
  font-family: var(--f-display); font-size: 110px; font-weight: 800;
  color: rgba(201,168,76,0.025); letter-spacing: 0.04em; pointer-events: none;
}
.cert__hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 1px solid var(--slate-2); padding-bottom: 12px; margin-bottom: 16px; position: relative; }
.cert__hd__t   { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.34em; color: var(--gold); text-transform: uppercase; }
.cert__hd__sub { font-family: var(--f-mono); font-size: 9px; color: var(--fg-faint); letter-spacing: 0.18em; margin-top: 4px; text-transform: uppercase; }
.cert__pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px 5px 9px; background: var(--bg-base);
  border: 1px solid var(--gold); border-radius: 999px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 500;
  color: var(--gold); letter-spacing: 0.18em;
}
.cert__pill svg { width: 11px; height: 11px; }
.cert__grid { position: relative; display: grid; grid-template-columns: 160px 1fr; gap: 10px 22px; font-family: var(--f-mono); font-size: 11.5px; }
.cert__k { color: var(--fg-faint); letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase; padding-top: 2px; }
.cert__v { color: var(--gold); letter-spacing: 0.02em; word-break: break-all; font-weight: 500; }
.cert__v--soft { color: var(--fg-2); font-weight: 400; }
.cert__sig { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 18px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--slate); }
.cert__sig__lbl { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.2em; color: var(--fg-faint); text-transform: uppercase; }
.cert__sig__lbl b { color: var(--gold); font-weight: 500; }
.cert__seal { width: 60px; height: 60px; opacity: 0.85; }

/* Timeline */
.tl { display: flex; flex-direction: column; gap: 0; padding: 6px 6px 6px 4px; position: relative; }
.tl::before { content: ""; position: absolute; left: 21px; top: 16px; bottom: 16px; width: 1px; background: var(--slate); }
.tl__item { display: grid; grid-template-columns: 42px 1fr; gap: 14px; padding: 10px 0; position: relative; }
.tl__dot { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); background: var(--bg-card); margin: 4px auto 0; }
.tl__item--critical .tl__dot { border-color: var(--amber); background: var(--amber-d); }
.tl__item--legal    .tl__dot { border-color: var(--steel-blue); background: var(--steel-blue); }
.tl__body { display: flex; flex-direction: column; gap: 4px; }
.tl__when { font-family: var(--f-mono); font-size: 10px; color: var(--fg-faint); letter-spacing: 0.16em; text-transform: uppercase; }
.tl__t    { font-family: var(--f-display); font-size: 15px; font-weight: 600; color: var(--fg); line-height: 1.4; }
.tl__d    { font-family: var(--f-serif); font-size: 13.5px; color: var(--fg-2); line-height: 1.55; }
.tl__tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.tl__tag  { font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--slate); color: var(--fg-3); border-radius: 2px; }
.tl__item--critical .tl__tag { color: var(--amber); border-color: rgba(224,160,64,0.35); }
.tl__item--legal    .tl__tag { color: var(--steel-blue); border-color: rgba(91,134,184,0.35); }

/* Actions */
.actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 6px; }

/* Idle state */
.idle-state {
  padding: 40px 24px; text-align: center;
  font-family: var(--f-mono); color: var(--fg-faint);
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  border: 1px dashed var(--slate-2); border-radius: 5px;
  margin: 8px 28px;
}

/* Loading */
.loading { display: flex; flex-direction: column; gap: 24px; padding: 36px 28px 48px; border-top: 1px solid var(--slate-2); margin-top: 8px; }
.loading__lbl { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--gold); letter-spacing: 0.34em; text-transform: uppercase; }
.loading__lbl__dots { display: inline-flex; gap: 4px; }
.loading__lbl__dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); animation: dots 1.4s ease-in-out infinite; }
.loading__lbl__dots i:nth-child(2) { animation-delay: .2s; }
.loading__lbl__dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dots { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
.loading__track { height: 3px; background: var(--slate-2); border-radius: 2px; overflow: hidden; position: relative; max-width: 720px; margin: 0 auto; width: 100%; }
.loading__fill  { position: absolute; left:0; top:0; bottom:0; background: linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-hi)); border-radius: 2px; transition: width .4s ease; }
.loading__steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.lstep { padding: 6px 12px; background: var(--bg-panel); border: 1px solid var(--slate); border-radius: 999px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg-faint); text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; }
.lstep.is-active { color: var(--gold); border-color: var(--gold); }
.lstep.is-done   { color: var(--gold-dark); border-color: var(--gold-line); }
.lstep__num { color: var(--fg-faint); font-size: 9px; }
.lstep.is-active .lstep__num { color: var(--gold); }

/* Mobile */
.mobile-toggle { display: none; }
.mobile-overlay { display: none; }
@media (max-width:1100px) { .hdr__meta { gap:12px; font-size:9px; } .hdr__meta span:nth-child(3) { display:none; } }
@media (max-width:920px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 56px 1fr; }
  .app__side { position: fixed; left:0; top:56px; bottom:0; width:86vw; max-width:320px; z-index:50; transform:translateX(-100%); transition:transform .25s ease; }
  .app__side.is-open { transform:translateX(0); box-shadow:12px 0 32px rgba(0,0,0,.5); }
  .app__main { grid-column:1; }
  .mobile-overlay { display:block; position:fixed; inset:56px 0 0 0; background:rgba(5,13,26,0.78); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
  .mobile-overlay.is-on { opacity:1; pointer-events:auto; }
  .mobile-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; background:transparent; border:1px solid var(--slate); border-radius:var(--radius-sm); color:var(--gold); }
  .hdr { padding:0 14px; gap:12px; } .hdr__meta { display:none; }
  .comp, .report, .loading { padding-left:18px; padding-right:18px; }
  .tabs { padding:0 14px; overflow-x:auto; }
  .confidence { grid-template-columns: auto 1fr; gap:18px; }
  .confidence__stat { grid-column:1/-1; border-left:0; border-top:1px solid var(--slate-2); padding-left:0; padding-top:14px; }
}
</style>
<style>
/* ── Additions for unified build (format selector, per-section confidence, scrollable module list) ── */
.side__scroll { overflow-y:auto; }
.fmt-row { display:flex; gap:6px; padding:0 6px; }
.fmt-btn {
  flex:1; background:var(--bg-card); border:1px solid var(--slate-2); border-radius:var(--radius);
  color:var(--fg-3); font-family:var(--f-mono); font-size:9.5px; letter-spacing:0.06em;
  padding:7px 4px; cursor:pointer; text-align:center; text-transform:uppercase; transition:all .15s;
}
.fmt-btn:hover { border-color:var(--gold-dark); color:var(--fg-2); }
.fmt-btn.is-on { background:var(--bg-hover); border-color:var(--gold); color:var(--gold); }
.sec__conf.is-high b { color:#3a7d55; }
.sec__conf.is-med  b { color:#c8a020; }
.sec__conf.is-low  b { color:#c0504f; }
.sec__flag {
  font-family:var(--f-mono); font-size:9px; line-height:1.5; color:#c8a020;
  background:rgba(200,160,32,0.07); border:1px solid rgba(200,160,32,0.25);
  border-radius:6px; padding:6px 10px; margin:8px 0 0;
}
.conf-crit {
  font-family:var(--f-mono); font-size:9.5px; line-height:1.6; color:#c0504f;
  margin-top:6px;
}
.sec__confbar { height:3px; border-radius:2px; margin-top:8px; background:var(--slate-2); overflow:hidden; }
.sec__confbar > i { display:block; height:100%; border-radius:2px; }
.hindi-block {
  background:rgba(91,134,184,0.07); border:1px solid rgba(91,134,184,0.3); border-radius:var(--radius);
  padding:16px; margin-top:14px;
}
.hindi-block__t {
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--steel-blue); margin-bottom:10px;
}
.hindi-block__body { font-family:var(--f-serif); font-size:15px; line-height:2; color:var(--fg-2); }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ── 9 UNIFIED MODULES (each maps to a genuinely distinct backend prompt) ──
const MODULES = [
  { id:'full',        label:'Full Report',       icon:'scales',  kbd:'1', api:'full' },
  { id:'medico',      label:'Medico-Legal',      icon:'pulse',   kbd:'2', api:'medico-legal' },
  { id:'malpractice', label:'Malpractice',       icon:'cross',   kbd:'3', api:'malpractice' },
  { id:'regs',        label:'Regulations & Ethics', icon:'doc',  kbd:'4', api:'regulations' },
  { id:'expert',      label:'Expert Witness',    icon:'gavel',   kbd:'5', api:'expert' },
  { id:'inquest',     label:'Inquest Brief',     icon:'book',    kbd:'6', api:'inquest' },
  { id:'autopsy',     label:'Autopsy Inference', icon:'autopsy', kbd:'7', api:'autopsy' },
  { id:'toxic',       label:'Toxicology',        icon:'flask',   kbd:'8', api:'toxicology' },
  { id:'precedent',   label:'Precedent Search',  icon:'search',  kbd:'9', api:'precedent' },
];

const FORMATS = [
  { id:'court', label:'Court' },
  { id:'study', label:'Study' },
  { id:'brief', label:'Brief' },
];

const STATUTES = [
  'BNS §103','BNS §105','BNS §106','BNS §115',
  'BNSS §174','BNSS §194','BNSS §196',
  'BSA §39','BSA §45',
  'IPC §299','IPC §300','IPC §304A','IEA §32','NMC 2019','MTP 2021','POCSO 2012'
];

const EXAMPLES = [
  { id:'MJ-DEATH-01', label:'Anaesthesia death', text:`24yo female, elective septoplasty, 11 Feb 2025. ASA-I. No pre-op ECG despite hospital SOP. GA induced 9:15AM (propofol, fentanyl, atracurium). 9:52AM sudden tachycardia, falling EtCO2 and SpO2. Anaesthesia record blank 9:52-10:08AM. Declared dead 10:47AM. PM: no anatomical cause, pulmonary oedema, heart normal, no PE. Tryptase not collected; no frozen muscle sample. Capnography alarm logged 9:49AM, three min before first documented response. Dantrolene absent from theatre. Generic single-page consent. Advise on cause/manner of death, standard of care, consent adequacy, criminal vs civil liability, and significance of missing samples.` },
  { id:'MJ-MISDX-01', label:'Missed dissection', text:`41yo male, ED 11:20PM 6 Mar 2025, tearing chest pain to back, BP 168/104 right arm, no left-arm reading. Dx "ACS — rule out MI", started aspirin+clopidogrel+heparin. Chest X-ray 11:55PM widened mediastinum, not reviewed by radiologist till morning. No CT aortogram, no cardiology escalation overnight. 4:50AM collapse, tamponade on echo, CT confirmed Stanford Type A dissection. Died 5:38AM. PM: tamponade from ruptured Type A dissection, ante-mortem progressive. Nursing chart gap 2:00-4:30AM. Advise on cause of death, breach of standard of care, criminal negligence threshold, and the "missed diagnosis is common" defence.` },
  { id:'MJ-CUST-01', label:'Custodial death', text:`34yo male, taken into police detention 9:40PM 14 Mar 2024, found unconscious in cell 6:15AM, declared dead 7:02AM. PM: multiple contusions lower back, bilateral upper arms, inner thighs; 4cm parietal laceration; left 3rd/4th rib fractures; haemoperitoneum; bilateral conjunctival petechiae; hyoid intact. Police claim fall from bunk. Two-hour gap between detention and jail admission. No CCTV. No magistrate informed within 24h. No medical exam at admission. Advise on cause of death, consistency with the fall account, inquest obligations, and liability.` },
  { id:'MJ-DOWRY-01', label:'Dowry death', text:`26yo female, found hanging in matrimonial home 8 Nov 2023, 18 months after marriage. Ligature mark inverted-V, incomplete, not encircling; furrow 1.5cm; hyoid fractured. Wrists found bound before police arrival. WhatsApp to mother 6 days prior alleging beating. Dowry demand history. Advise on classification, manner of death (homicidal vs suicidal), applicable sections, and burden of proof.` },
  { id:'MJ-TOX-01', label:'Suspected poisoning', text:`45yo male, found unconscious at home after dinner party, declared dead. PM: mild cyanosis, unusual gastric odour, conjunctival petechiae, pulmonary oedema. Toxicology (38 days later): chlorpyrifos 2.3 mcg/g liver, reduced cholinesterase, ethanol nil. Business dispute motive; deceased owned a farmhouse with pesticide access. Advise on whether the concentration is consistent with fatal poisoning, accidental vs homicidal exposure, the organophosphate syndrome, and chain-of-custody integrity.` },
  { id:'MJ-NEO-01', label:'Neonatal death', text:`Term neonate, 38 weeks, normal delivery 12 Jan 2024. APGAR 6 at 1min, 8 at 5min. At 4h grunting and subcostal retractions noted; resident not documented as examining. At 6h unresponsive; died 7h. PM: bilateral atelectasis, hyaline membranes on histology, Grade II IVH. No monitoring records 1h-4h. Advise on whether the death was preventable and whether the documentation/monitoring failures constitute negligence.` },
];

const SAMPLE = EXAMPLES[0].text;

const LOADING_STEPS = ['Parse fact pattern','Index statutes','Retrieve precedents','Forensic inference','Audit confidence','Sign & hash'];

// ── HELPERS ──
function parseReport(text) {
  return text.split(/\n(?=§\d+\.)/).map(part => {
    const m = part.match(/^§(\d+)\.\s*([^\n]+)\n?([\s\S]*)/);
    if (!m) return null;
    return { n:`§${m[1].padStart(2,'0')}`, numRaw:parseInt(m[1]), title:m[2].trim(), body:m[3].trim() };
  }).filter(Boolean);
}
function generateCaseId() {
  const n=new Date(), y=n.getFullYear(), m=String(n.getMonth()+1).padStart(2,'0'), d=String(n.getDate()).padStart(2,'0');
  const r=Math.random().toString(36).slice(2,5).toUpperCase();
  return `MJ-${y}-${m}${d}-${r}`;
}
function fmtTimestamp(iso){ if(!iso)return''; return new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'})+' IST'; }
function nowIST(){ return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Kolkata'})+' IST'; }
function tierFor(score){ return score>=8?'high':score>=6?'med':'low'; }
function tierLabel(score){ return score>=8?'HIGH':score>=6?'MODERATE':'LOW'; }
function barColor(score){ return score>=8?'#3a7d55':score>=6?'#c8a020':'#c0504f'; }

// ── SEAL ──
const useId = React.useId || (() => useMemo(() => 'id'+Math.random().toString(36).slice(2,8), []));
function ChironSeal({ size=32 }) {
  const id = useId();
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" aria-label="Chiron seal">
      <defs><linearGradient id={`g-${id}`} x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stopColor="#e8c87a"/><stop offset="55%" stopColor="#c9a84c"/><stop offset="100%" stopColor="#a07830"/>
      </linearGradient></defs>
      <circle cx="24" cy="24" r="22" fill="none" stroke={`url(#g-${id})`} strokeWidth="0.9"/>
      <circle cx="24" cy="24" r="19.5" fill="none" stroke="#c9a84c" strokeOpacity="0.35" strokeWidth="0.5"/>
      <g stroke={`url(#g-${id})`} fill="none" strokeWidth="1.1" strokeLinecap="round">
        <line x1="24" y1="11" x2="24" y2="36.5"/>
        <circle cx="24" cy="10" r="1.3" fill="#c9a84c" stroke="none"/>
        <path d="M 24 13 C 19 13 17 15 16.5 17.5 C 19 16.5 21.5 16.5 24 17.5"/>
        <path d="M 24 13 C 29 13 31 15 31.5 17.5 C 29 16.5 26.5 16.5 24 17.5"/>
        <path d="M 19 19 C 24 22,24 22,29 25 C 24 28,24 28,19 31 C 24 33.5,24 33.5,29 36" strokeOpacity="0.85"/>
        <path d="M 29 19 C 24 22,24 22,19 25 C 24 28,24 28,29 31 C 24 33.5,24 33.5,19 36" strokeOpacity="0.55"/>
      </g>
    </svg>
  );
}

// ── MODULE ICON ──
function ModIcon({ name }) {
  const p = { width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round' };
  switch(name){
    case 'scales':  return <svg {...p}><path d="M12 3v18M5 21h14M7 8l-3 7a3 3 0 0 0 6 0L7 8zm10 0l-3 7a3 3 0 0 0 6 0l-3-7zM7 8h10"/></svg>;
    case 'doc':     return <svg {...p}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>;
    case 'pulse':   return <svg {...p}><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>;
    case 'flask':   return <svg {...p}><path d="M9 3h6M10 3v6L4 19a2 2 0 0 0 1.7 3h12.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M6.5 15h11"/></svg>;
    case 'book':    return <svg {...p}><path d="M4 4h11a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3V4z"/><path d="M4 18a3 3 0 0 1 3-3h11"/></svg>;
    case 'search':  return <svg {...p}><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>;
    case 'cross':   return <svg {...p}><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>;
    case 'gavel':   return <svg {...p}><path d="M14 3l7 7-3 3-7-7zM11 6l-7 7M3 21h8M6.5 13.5l4 4"/></svg>;
    case 'autopsy': return <svg {...p}><circle cx="12" cy="6" r="3"/><path d="M12 9v8M8 13h8M9 21l3-4 3 4"/></svg>;
    default: return null;
  }
}

// ── SIDEBAR ──
function Sidebar({ active, onModule, format, onFormat, open, onClose }) {
  const recent = useMemo(() => { try { return JSON.parse(localStorage.getItem('chiron-recent')||'[]').slice(0,4); } catch { return []; } }, []);
  return (
    <aside className={`app__side side ${open?'is-open':''}`}>
      <div className="side__inner side__scroll">
        <div>
          <div className="side__lbl">Modules</div>
          {MODULES.map(m => (
            <button key={m.id} className={`mod ${active===m.id?'is-active':''}`} onClick={() => { onModule(m.id); onClose && onClose(); }}>
              <span className="mod__ic"><ModIcon name={m.icon}/></span>
              <span>{m.label}</span>
              <span className="mod__kbd">⌘ {m.kbd}</span>
            </button>
          ))}
        </div>
        <div>
          <div className="side__lbl">Output Format</div>
          <div className="fmt-row">
            {FORMATS.map(f => (
              <button key={f.id} className={`fmt-btn ${format===f.id?'is-on':''}`} onClick={() => onFormat(f.id)}>{f.label}</button>
            ))}
          </div>
        </div>
        <div>
          <div className="side__lbl">Statutes Bank</div>
          <div className="tags">{STATUTES.map(s => <span key={s} className="tag">{s}</span>)}</div>
        </div>
        {recent.length > 0 && (
          <div>
            <div className="side__lbl">Recent Briefs</div>
            <div style={{ display:'flex', flexDirection:'column', gap:2, padding:'0 6px' }}>
              {recent.map(id => (
                <button key={id} className="mod" style={{ padding:'7px 10px' }}>
                  <span className="mod__ic" style={{ fontFamily:'var(--f-mono)', fontSize:10 }}>§</span>
                  <span style={{ fontFamily:'var(--f-mono)', fontSize:11, letterSpacing:'0.08em', color:'var(--fg-3)' }}>{id}</span>
                  <span className="mod__kbd"/>
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
      <div className="side__foot">
        <div className="side__foot__pwr">⟁  POWERED BY GROK 4</div>
        <div className="side__foot__ver">CHIRON v3.1 · UNIFIED</div>
      </div>
    </aside>
  );
}

// ── HEADER ──
function Header({ onToggleSide }) {
  const [time, setTime] = useState(nowIST);
  useEffect(() => { const id=setInterval(()=>setTime(nowIST()),1000); return ()=>clearInterval(id); }, []);
  return (
    <header className="app__hdr hdr">
      <button className="mobile-toggle" onClick={onToggleSide} aria-label="Open sidebar">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <ChironSeal size={34}/>
      <div className="hdr__title">
        <div className="hdr__brand">Chiron</div>
        <div className="hdr__sub">Medical Jurisprudence Intelligence · Court-Grade Counsel</div>
      </div>
      <div className="hdr__meta">
        <span>SESSION · <b>{time}</b></span>
        <span>JURIS · <b>IN-DEL</b></span>
        <span>NODE · <b>CHIRON-A04</b></span>
      </div>
      <span className="status-badge"><span className="status-badge__dot"/>ACTIVE</span>
    </header>
  );
}

// ── TABS ──
function Tabs({ value, onChange, reportCount }) {
  const tabs = [
    { id:'brief', label:'Brief', count: reportCount||null },
    { id:'evidence', label:'Evidence Log', count:null },
    { id:'cites', label:'Citations', count:null },
    { id:'export', label:'Export', count:null },
    { id:'history', label:'History', count:null },
  ];
  return (
    <nav className="tabs" role="tablist">
      {tabs.map(t => (
        <button key={t.id} role="tab" aria-selected={value===t.id} className={`tab ${value===t.id?'is-active':''}`} onClick={() => onChange(t.id)}>
          {t.label}{t.count!=null && <span className="tab__count">{t.count}</span>}
        </button>
      ))}
    </nav>
  );
}

// ── SETTING TOGGLE (now controlled) ──
function SettingToggle({ label, on, onChange }) {
  return (
    <button className={`toggle ${on?'is-on':''}`} onClick={() => onChange(!on)}>
      <span className="toggle__sw"/>{label}
    </button>
  );
}

// ── COMPOSER ──
function Composer({ value, onChange, onSubmit, onClear, busy, activeModule, opts, setOpts }) {
  const mod = MODULES.find(m => m.id === activeModule) || MODULES[0];
  const caseId = useMemo(generateCaseId, []);
  return (
    <div className="comp">
      <div className="comp__head">
        <div>
          <div className="comp__h">Medical Jurisprudence Brief</div>
          <div className="comp__sub" style={{ marginTop:4 }}>{mod.label} · Submit a clinical-forensic fact pattern · Indian statute</div>
        </div>
        <div className="comp__case"><span>NEXT FILING</span><b>{caseId}</b></div>
      </div>

      <div className="textarea-wrap">
        <textarea className="textarea"
          placeholder="Describe the case — clinical findings, mechanism, circumstances, prior history, and the date of the incident. Chiron will return a court-grade brief with cited authorities."
          value={value} onChange={e => onChange(e.target.value)}/>
        <div className="textarea-wrap__foot">
          <span>{value.length.toLocaleString()} characters · ~{Math.ceil(value.length/4).toLocaleString()} tokens</span>
          <div style={{ display:'flex', gap:6 }}>
            <button onClick={() => onChange(SAMPLE)}>LOAD SAMPLE</button>
            <button onClick={onClear}>CLEAR</button>
          </div>
        </div>
      </div>

      <div className="examples">
        <span className="examples__lbl">Case patterns</span>
        <div className="examples__row">
          {EXAMPLES.map(ex => (
            <button key={ex.id} className="ex" onClick={() => onChange(ex.text)}>
              <span className="ex__id">{ex.id}</span>{ex.label}
            </button>
          ))}
        </div>
      </div>

      <div className="comp__bar">
        <div className="comp__settings">
          <SettingToggle label="Cite Precedents" on={opts.citePrecedents} onChange={v => setOpts(o => ({...o, citePrecedents:v}))}/>
          <SettingToggle label="BNS / BNSS Cross-ref" on={opts.crossRef} onChange={v => setOpts(o => ({...o, crossRef:v}))}/>
          <SettingToggle label="Hindi Translation" on={opts.hindi} onChange={v => setOpts(o => ({...o, hindi:v}))}/>
          <SettingToggle label="Forensic Timeline" on={opts.forensicTimeline} onChange={v => setOpts(o => ({...o, forensicTimeline:v}))}/>
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <button className="btn btn--ghost" onClick={onClear}>Clear</button>
          <button className="btn btn--primary" onClick={onSubmit} disabled={busy || value.trim().length < 12}>
            {busy ? 'Analysing…' : <>Generate Brief <span style={{marginLeft:2}}>↗</span></>}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── LOADING ──
function LoadingState({ progress }) {
  const stepIdx = Math.min(LOADING_STEPS.length-1, Math.floor(progress/(100/LOADING_STEPS.length)));
  return (
    <div className="loading">
      <div className="loading__lbl">
        <span>CHIRON IS ANALYSING YOUR CASE VIA GROK 4</span>
        <span className="loading__lbl__dots"><i/><i/><i/></span>
      </div>
      <div className="loading__track"><div className="loading__fill" style={{ width:`${progress}%` }}/></div>
      <div className="loading__steps">
        {LOADING_STEPS.map((s,i) => (
          <span key={s} className={`lstep ${i<stepIdx?'is-done':''} ${i===stepIdx?'is-active':''}`}>
            <span className="lstep__num">0{i+1}</span>{s}
          </span>
        ))}
      </div>
    </div>
  );
}

// ── OVERALL CONFIDENCE ──
function ConfidenceBlock({ confidence, sections, tokens, module }) {
  const score = confidence?.overallScore || 7;
  const [animated, setAnimated] = useState(0);
  useEffect(() => { const t=setTimeout(()=>setAnimated(score*10),100); return ()=>clearTimeout(t); }, [score]);
  const crit = confidence?.criticalFlags || [];
  return (
    <div className="confidence" style={{ flex:'0 0 100%', marginTop:14 }}>
      <div className="confidence__score">
        <div className="confidence__score__num">{score}<span style={{ fontSize:22, color:'var(--gold-dark)', marginLeft:4 }}>/10</span></div>
        <div className="confidence__score__lbl">Overall Confidence</div>
      </div>
      <div className="confidence__bar">
        <div className="confidence__bar__top">
          <span>Calibrated Confidence</span>
          <b>{tierLabel(score)} · MEDICO-LEGAL CORRO. REQ'D</b>
        </div>
        <div className="confidence__bar__track">
          <div className="confidence__bar__fill" style={{ width:`${animated}%`, background:barColor(score) }}/>
        </div>
        {crit.length > 0
          ? <div className="conf-crit">⚠ {crit.join(' · ')}</div>
          : <div className="confidence__bar__flag">Corroborate findings with primary clinical records and registered practitioner review.</div>}
      </div>
      <div className="confidence__stat">
        <div className="confidence__stat__row"><span>Sections</span><b>{sections}</b></div>
        <div className="confidence__stat__row"><span>Tokens</span><b>{tokens?.toLocaleString() || '—'}</b></div>
        <div className="confidence__stat__row"><span>Module</span><b>{(module||'FULL').toUpperCase()}</b></div>
      </div>
    </div>
  );
}

// ── REPORT SECTION (real confidence from auditor) ──
function ReportSection({ sec, conf }) {
  const score = conf?.score;
  const tier = score != null ? tierFor(score) : null;
  return (
    <div className="sec">
      <div className="sec__hd">
        <span className="sec__num">{sec.n}</span>
        <span className="sec__title">{sec.title}</span>
        {score != null && <span className={`sec__conf is-${tier}`}><b>{score}/10</b> {(conf.risk||'').toUpperCase()}</span>}
      </div>
      {score != null && <div className="sec__confbar"><i style={{ width:`${score*10}%`, background:barColor(score) }}/></div>}
      {conf?.flag && <div className="sec__flag">⚠ {conf.flag}</div>}
      <div className="finding"><div className="finding__body">{sec.body}</div></div>
    </div>
  );
}

// ── CERTIFICATE ──
function CertificateBlock({ cert }) {
  return (
    <div className="cert">
      <div className="cert__hd">
        <div>
          <div className="cert__hd__t">— Document Integrity Certificate —</div>
          <div className="cert__hd__sub">SHA-256 · Auditable Chain of Custody · BSA 2023 §61-65</div>
        </div>
        <span className="cert__pill">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 6.2l2.4 2.4 4.6-5"/></svg>
          HASH VERIFIED
        </span>
      </div>
      <div className="cert__grid">
        <div className="cert__k">Report ID</div><div className="cert__v cert__v--soft">{cert.reportId}</div>
        <div className="cert__k">Timestamp</div><div className="cert__v cert__v--soft">{cert.timestamp}</div>
        <div className="cert__k">Case Input Hash</div><div className="cert__v">{cert.caseHash}</div>
        <div className="cert__k">Document Hash</div><div className="cert__v">{cert.reportHash}</div>
        <div className="cert__k">Algorithm</div><div className="cert__v cert__v--soft">SHA-256 (FIPS 180-4)</div>
        <div className="cert__k">AI Model</div><div className="cert__v cert__v--soft">{cert.model || 'GROK-4'}</div>
      </div>
      <div className="cert__sig">
        <div>
          <div className="cert__sig__lbl">Issued under <b>Bharatiya Sakshya Adhiniyam 2023 §63-65 · IT Act 2000 §85B</b></div>
          <div className="cert__sig__lbl" style={{ marginTop:6 }}>Tamper-evident · machine-verifiable · admissible as electronic record</div>
        </div>
        <ChironSeal size={60}/>
      </div>
    </div>
  );
}

function Disclaimer() {
  return (
    <div className="disclaimer">
      <b>Statutory Disclaimer</b>
      Chiron is an artificial intelligence research assistant. Output constitutes neither legal advice nor a medical opinion within the meaning of §45 IEA / §39 BSA. All findings must be independently verified by a registered medical practitioner and an enrolled advocate before any pleading, affidavit, or submission to a Court of competent jurisdiction.
    </div>
  );
}

// ── HINDI (inline, on demand) ──
function HindiBlock({ reportText }) {
  const [state, setState] = useState('idle'); // idle | loading | done | error
  const [hindi, setHindi] = useState('');
  const [err, setErr] = useState('');
  const run = async () => {
    setState('loading'); setErr('');
    try {
      const res = await fetch('/api/hindi', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ report: reportText }) });
      const j = await res.json();
      if (!res.ok || !j.success) throw new Error(j.error || 'Translation failed');
      setHindi(j.hindi); setState('done');
    } catch(e) { setErr(e.message); setState('error'); }
  };
  if (state === 'idle') return <button className="btn btn--hindi" onClick={run}>हिंदी अनुवाद</button>;
  if (state === 'loading') return <div className="hindi-block"><div className="hindi-block__t">हिंदी अनुवाद — अनुवाद हो रहा है…</div></div>;
  if (state === 'error') return <div className="error-banner"><b>Translation Failed</b>{err}</div>;
  return <div className="hindi-block"><div className="hindi-block__t">हिंदी सारांश — मुवक्किल / वादी के लिए</div><div className="hindi-block__body">{hindi.split('\n').map((l,i)=><div key={i}>{l}</div>)}</div></div>;
}

function Actions({ onDownloadPDF, pdfBusy, onNewAnalysis, reportText }) {
  return (
    <div className="actions">
      <button className="btn btn--primary" onClick={onDownloadPDF} disabled={pdfBusy}>{pdfBusy ? 'Generating PDF…' : '⤓ Download Signed PDF'}</button>
      <HindiBlock reportText={reportText}/>
      <button className="btn btn--ghost" onClick={onNewAnalysis}>New Analysis</button>
    </div>
  );
}

// ── REPORT ──
function Report({ data, onDownloadPDF, pdfBusy, onNewAnalysis }) {
  const { sections, certificate, reportText, confidence } = data;
  const displayTs = fmtTimestamp(certificate?.timestamp);
  const confFor = (numRaw) => confidence?.sections?.find(s => parseInt(s.num) === numRaw) || null;
  return (
    <section className="report">
      <header className="report__head">
        <div>
          <div className="report__id" style={{ marginBottom:6 }}>BRIEF <b>{certificate?.reportId || '—'}</b> · FILED {displayTs}</div>
          <h1>{sections[0]?.title || 'Medico-Legal Analysis Report'}</h1>
          <div className="report__id" style={{ marginTop:8, color:'var(--fg-faint)' }}>MODULE · {(certificate?.module||'Full Report')} · FORMAT · {(certificate?.format||'study').toUpperCase()} · INDIAN JURISDICTION</div>
        </div>
        <ConfidenceBlock confidence={confidence} sections={sections.length} tokens={certificate?.tokens} module={certificate?.module}/>
      </header>
      {sections.map((s,i) => <ReportSection key={i} sec={s} conf={confFor(s.numRaw)}/>)}
      <Disclaimer/>
      {certificate && <CertificateBlock cert={certificate}/>}
      <Actions onDownloadPDF={onDownloadPDF} pdfBusy={pdfBusy} onNewAnalysis={onNewAnalysis} reportText={reportText}/>
    </section>
  );
}

// ── APP ──
function App() {
  const [activeModule, setActiveModule] = useState('full');
  const [format, setFormat] = useState('study');
  const [tab, setTab] = useState('brief');
  const [text, setText] = useState(SAMPLE);
  const [phase, setPhase] = useState('idle');
  const [progress, setProgress] = useState(0);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [reportData, setReportData] = useState(null);
  const [errorMsg, setErrorMsg] = useState('');
  const [pdfBusy, setPdfBusy] = useState(false);
  const [opts, setOpts] = useState({ citePrecedents:true, crossRef:true, hindi:false, forensicTimeline:true });
  const progressRef = useRef(null);

  const startProgress = useCallback(() => {
    setProgress(0); const start = Date.now();
    const run = () => { const p = Math.min(90, ((Date.now()-start)/25000)*90); setProgress(p); progressRef.current = requestAnimationFrame(run); };
    progressRef.current = requestAnimationFrame(run);
  }, []);
  const stopProgress = useCallback((toFull=false) => { if (progressRef.current) cancelAnimationFrame(progressRef.current); if (toFull) setProgress(100); }, []);

  const onSubmit = async () => {
    if (text.trim().length < 12) return;
    setPhase('loading'); setTab('brief'); setErrorMsg(''); startProgress();
    const mod = MODULES.find(m => m.id === activeModule) || MODULES[0];
    try {
      const res = await fetch('/api/analyze', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ caseText:text.trim(), module:mod.api, format, options:opts })
      });
      const json = await res.json();
      stopProgress(true);
      if (!res.ok || !json.success) { setErrorMsg(json.error || 'Analysis failed. Please try again.'); setPhase('error'); return; }
      const sections = parseReport(json.report || '');
      setReportData({ sections, certificate:json.certificate, reportText:json.report, confidence:json.confidence });
      try {
        const prev = JSON.parse(localStorage.getItem('chiron-recent')||'[]');
        const updated = [json.certificate?.reportId, ...prev.filter(x=>x!==json.certificate?.reportId)].slice(0,4);
        localStorage.setItem('chiron-recent', JSON.stringify(updated));
      } catch {}
      // Auto-trigger Hindi is handled inline by the toggle living in the report; keep toggle state available
      setTimeout(() => setPhase('report'), 200);
    } catch (err) {
      stopProgress(); setErrorMsg('Network error: ' + (err.message || 'Could not reach Chiron API.')); setPhase('error');
    }
  };

  const onDownloadPDF = async () => {
    if (!reportData) return;
    setPdfBusy(true);
    try {
      const res = await fetch('/api/pdf', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ report: reportData.reportText, certificate: reportData.certificate, confidence: reportData.confidence }) });
      if (!res.ok) { const j = await res.json().catch(()=>({})); alert(j.error || 'PDF generation failed.'); return; }
      const blob = await res.blob(); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `Chiron-${reportData.certificate?.reportId || 'report'}.pdf`; a.click();
      URL.revokeObjectURL(url);
    } catch (err) { alert('PDF error: ' + err.message); } finally { setPdfBusy(false); }
  };

  const onClear = () => { setText(''); setPhase('idle'); setReportData(null); setErrorMsg(''); };
  const onNewAnalysis = () => { setPhase('idle'); setReportData(null); setErrorMsg(''); };

  return (
    <div className="app">
      <Header onToggleSide={() => setSidebarOpen(o => !o)}/>
      <Sidebar active={activeModule} onModule={setActiveModule} format={format} onFormat={setFormat} open={sidebarOpen} onClose={() => setSidebarOpen(false)}/>
      <div className={`mobile-overlay ${sidebarOpen?'is-on':''}`} onClick={() => setSidebarOpen(false)}/>
      <main className="app__main main">
        <Tabs value={tab} onChange={setTab} reportCount={reportData ? 1 : null}/>
        <Composer value={text} onChange={setText} onSubmit={onSubmit} onClear={onClear} busy={phase==='loading'} activeModule={activeModule} opts={opts} setOpts={setOpts}/>
        {phase === 'loading' && <LoadingState progress={progress}/>}
        {phase === 'error' && <div className="error-banner"><b>Analysis Failed</b>{errorMsg}</div>}
        {phase === 'report' && reportData && <Report data={reportData} onDownloadPDF={onDownloadPDF} pdfBusy={pdfBusy} onNewAnalysis={onNewAnalysis}/>}
        {phase === 'idle' && <div className="idle-state">No brief generated · submit a fact pattern to begin</div>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
